<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>pixelfx</title>
<meta name="description" data-i18n-content="description" content="由代码驱动的像素特效与动画，支持实时预览、配色调整和精灵图导出。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Funnel+Sans:wght@400;500&family=Red+Hat+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<!--BODY-->
<header class="head">
  <div class="title">
    <svg class="mark" viewBox="0 0 7 7" shape-rendering="crispEdges" role="img" aria-label="Patch"><rect x="1" y="1" width="6" height="6" fill="#ffffff"/><rect x="0" y="0" width="3" height="3" fill="#f53cd1"/></svg>
    <div>
      <h1>pixelfx.</h1>
      <p class="sub" data-i18n="subtitle">像素特效，每一个都由代码驱动。</p>
    </div>
  </div>
  <nav class="links">
    <a href="https://github.com/patch-gg/pixelfx" target="_blank" rel="noopener">github</a>
    <a href="../README.md#the-skill" target="_blank" rel="noopener" data-i18n="skill">Codex 技能</a>
    <a href="https://patch.gg" target="_blank" rel="noopener">patch.gg</a>
    <select class="btn language" data-language data-i18n-aria-label="language" aria-label="语言"></select>
  </nav>
</header>
<div class="bar">
  <div class="bar-in">
    <div class="chips" id="chips" role="toolbar" data-i18n-aria-label="categoriesLabel" aria-label="特效分类"></div>
    <input id="q" type="search" data-i18n-placeholder="search" data-i18n-aria-label="searchLabel" placeholder="搜索特效" aria-label="搜索特效" autocomplete="off">
  </div>
</div>
<main id="grid"></main>
<p class="empty" id="none" data-i18n="empty" hidden>没有找到匹配的特效，试试“火焰”“斩击”或 loop。</p>
<dialog class="detail" id="detail" aria-labelledby="d-name">
  <div class="sheet">
    <div>
      <div class="big"><canvas id="big"></canvas><button class="close" id="d-close" type="button" data-i18n="close">关闭</button></div>
    </div>
    <div class="info">
      <div class="detail-tools"><select class="btn language" data-language data-i18n-aria-label="language" aria-label="语言"></select></div>
      <h2 id="d-name"></h2>
      <div class="id" id="d-id"></div>
      <p id="d-desc"></p>
      <dl class="facts" id="d-facts"></dl>
      <div class="controls">
        <div class="row"><label data-i18n="play">播放</label><button class="btn" id="d-play" type="button">暂停</button><button class="btn" id="d-again" type="button" data-i18n="again">重播</button><span id="d-speed" class="row"></span></div>
        <div class="row"><label data-i18n="backdrop">背景</label><span id="d-bg" class="row"></span></div>
        <div class="row"><label data-i18n="palette">配色</label><select class="btn" id="d-pal" data-i18n-aria-label="palette" aria-label="配色"></select><button class="btn" id="d-seed" type="button" data-i18n="seed">随机种子</button></div>
        <div class="row" id="d-character-controls" hidden>
          <label for="d-character-style" data-i18n="appearance">角色形象</label>
          <select id="d-character-style" class="btn"></select>
          <label for="d-character-seed" data-i18n="characterSeed">角色种子</label>
          <input id="d-character-seed" class="btn" type="number" min="0" max="4294967295" step="1" required>
          <button class="btn" id="d-character-roll" type="button" data-i18n="rollCharacter">随机生成</button>
        </div>
        <div class="row"><label data-i18n="show">显示</label><button class="btn" id="d-flip" type="button" data-i18n="mirror">镜像</button><button class="btn" id="d-actor" type="button" data-i18n="character">角色</button><button class="btn" id="d-make" type="button" data-i18n="spriteSheet">精灵图</button></div>
      </div>
      <div class="code-head"><span data-i18n="use">使用示例</span><span><a id="d-src" target="_blank" rel="noopener" data-i18n="source">源码</a> · <button class="btn" id="d-copy" type="button" data-i18n="copy">复制</button></span></div>
      <pre id="d-code"></pre>
    </div>
    <div class="sheetout" id="d-sheet"></div>
  </div>
</dialog>
<!--/BODY-->
<script type="module" src="app.js"></script>
</body>
</html>
